name: TechBank QA

on:
  pull_request:
    branches: [develop, main]

  push:
    branches: [develop]

jobs:

  # =========================================================
  # 1. TEST
  # =========================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas Maven
        run: |
          chmod +x mvnw
          ./mvnw -B package


  # =========================================================
  # 2. BUILD + PUBLICACIÓN EN GHCR
  # Solo ocurre cuando hay push a develop
  # =========================================================
  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Definir nombre de imagen
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        run: |
          docker build \
            --build-arg APP_COMMIT="$GITHUB_SHA" \
            -t "$IMAGE" .

          docker push "$IMAGE"


  # =========================================================
  # 3. DESPLIEGUE AUTOMÁTICO A AZURE QA
  # =========================================================
  deploy_qa:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Autenticar en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar Azure Container Apps CLI
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --allow-preview true

      - name: Desplegar imagen en Azure QA y validar
        env:
          RG: ${{ vars.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"

          echo "=============================================="
          echo "Imagen a desplegar:"
          echo "$IMAGE"
          echo "=============================================="

          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$IMAGE"

          echo "Obteniendo FQDN de Azure Container Apps..."

          FQDN=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Aplicación disponible en:"
          echo "https://$FQDN"

          echo "Esperando que la nueva revisión esté disponible..."

          ok=0

          for attempt in {1..30}; do

            echo "Intento $attempt de 30..."

            health=$(curl -fsS \
              "https://$FQDN/actuator/health" || true)

            version=$(curl -fsS \
              "https://$FQDN/version" || true)

            echo "Health: $health"
            echo "Version: $version"

            if [[ "$health" == *"UP"* && "$version" == *"$GITHUB_SHA"* ]]; then
              echo "=============================================="
              echo "DESPLIEGUE QA VALIDADO CORRECTAMENTE"
              echo "SHA: $GITHUB_SHA"
              echo "=============================================="

              ok=1
              break
            fi

            sleep 10
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "ERROR: La revisión de QA no superó las validaciones."
            exit 1
          fi

          echo "Validando solicitudes..."

          curl -fsS \
            "https://$FQDN/api/solicitudes"

          echo ""
          echo "=============================================="
          echo "QA FINALIZADO CORRECTAMENTE"
          echo "=============================================="